<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, setDoc, getDoc, getDocs, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyDvXu1k4kPWBDnmBZxDs6McM9fqntMMphw",
  authDomain: "tb-cantieri.firebaseapp.com",
  projectId: "tb-cantieri",
  storageBucket: "tb-cantieri.firebasestorage.app",
  messagingSenderId: "91212110377",
  appId: "1:91212110377:web:cbb842678fb0d311a79a38"
};
let fbDb = null;
try {
  const fbApp = initializeApp(firebaseConfig);
  fbDb = getFirestore(fbApp);
  window._fbDb = fbDb;
  window._fbEnabled = true;
} catch(e) { window._fbEnabled = false; }

window._fbLoadCantieri = async () => {
  if (!fbDb) return [];
  try {
    const snap = await getDocs(collection(fbDb, 'tbcantieri_v2'));
    const cantieri = [];
    snap.forEach(d => {
      if (d.id !== '__globali' && d.id !== '__contabile') cantieri.push({ id: d.id, ...d.data() });
    });
    return cantieri;
  } catch(e) { return []; }
};

window._fbLoadContabile = async () => {
  if (!fbDb) return null;
  try {
    const snap = await getDoc(doc(fbDb, 'tbcantieri_v2', '__contabile'));
    return snap.exists() ? snap.data() : { fatture: [], movimenti: [], updatedAt: null };
  } catch(e) { return { fatture: [], movimenti: [], updatedAt: null }; }
};

window._fbSaveContabile = async (data) => {
  if (!fbDb) return;
  try {
    await setDoc(doc(fbDb, 'tbcantieri_v2', '__contabile'), {
      ...data,
      updatedAt: Date.now(),
      updatedBy: window._currentUser || 'Matteo'
    }, { merge: true });
  } catch(e) { console.warn('fbSaveContabile error:', e); }
};

window._fbListenContabile = (cb) => {
  if (!fbDb) return;
  onSnapshot(doc(fbDb, 'tbcantieri_v2', '__contabile'), snap => {
    cb(snap.exists() ? snap.data() : { fatture: [], movimenti: [] });
  });
};
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Nunito:wght@400;500;600;700;800&display=swap');
:root{--g0:#0d2b1a;--g1:#1a4a2e;--g2:#2d6a4f;--g3:#40916c;--g4:#52b788;--g5:#95d5b2;--g6:#d8f3dc;--white:#fff;--off:#f7faf8;--s1:#f0f5f2;--s2:#e2ede6;--s3:#b8d4c0;--s4:#6a9478;--text:#1a2e22;--soft:#4d6b58;--amber:#d97706;--amber-bg:#fffbeb;--amber-border:#fde68a;--red:#dc2626;--red-bg:#fef2f2;--red-border:#fecaca;--blue:#1d4ed8;--blue-bg:#eff6ff;--blue-border:#bfdbfe;--shadow:0 2px 12px rgba(26,74,46,.10);--r:12px;--r-sm:8px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Nunito',sans-serif;background:var(--off);color:var(--text);display:flex;flex-direction:column}
.topbar{background:var(--g1);color:#fff;height:62px;display:flex;align-items:center;gap:10px;padding:0 14px;flex-shrink:0;position:relative;z-index:60;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.tb-logo{width:44px;height:44px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.tb-logo img{width:44px;height:44px;object-fit:cover;border-radius:50%}
.tb-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;letter-spacing:2px;color:#fff}
.tb-sub{font-size:10px;color:rgba(255,255,255,.55)}
.tb-user{margin-left:auto;background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:50%;width:34px;height:34px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Nunito',sans-serif;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fb-dot{width:10px;height:10px;border-radius:50%;background:#888;flex-shrink:0;margin-left:6px}
.fb-dot.ok{background:#4ade80}
.fb-dot.err{background:#f87171}
.app-body{flex:1;overflow:hidden;display:flex;flex-direction:column;max-width:800px;margin:0 auto;width:100%;position:relative}
.nav-tabs{display:flex;background:#fff;border-bottom:1px solid var(--s2);overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{flex:none;padding:12px 16px;border:none;background:none;font-size:12px;font-weight:600;color:var(--s4);cursor:pointer;white-space:nowrap;border-bottom:2.5px solid transparent;margin-bottom:-1px;font-family:'Nunito',sans-serif;letter-spacing:.3px;transition:color .15s}
.nav-tab.active{color:var(--g1);border-bottom-color:var(--g1)}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:20px}
.screen::-webkit-scrollbar{width:4px}
.screen::-webkit-scrollbar-thumb{background:var(--s3);border-radius:2px}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 12px 4px}
.kpi-box{background:#fff;border-radius:var(--r-sm);border:1px solid var(--s2);padding:12px 14px;box-shadow:var(--shadow)}
.kpi-label{font-size:10px;color:var(--soft);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.kpi-val{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:var(--g1)}
.kpi-val.green{color:var(--g3)}
.kpi-val.red{color:var(--red)}
.kpi-val.amber{color:var(--amber)}
.section-card{background:#fff;border-radius:var(--r);border:1px solid var(--s2);box-shadow:var(--shadow);margin:10px 12px;overflow:hidden}
.section-head{padding:12px 14px;background:var(--s1);border-bottom:1px solid var(--s2);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--g1);letter-spacing:.5px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.row-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--s1);font-size:13px}
.row-item:last-child{border-bottom:none}
.row-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.row-main{flex:1;min-width:0}
.row-name{font-weight:600;color:var(--text)}
.row-sub{font-size:11px;color:var(--soft);margin-top:1px}
.row-amount{font-weight:700;white-space:nowrap}
.row-amount.pos{color:var(--g2)}
.row-amount.neg{color:var(--red)}
.row-date{font-size:11px;color:var(--soft);white-space:nowrap;margin-left:6px}
.chip{display:inline-flex;align-items:center;border-radius:99px;padding:2px 9px;font-size:10px;font-weight:700;white-space:nowrap}
.chip-green{background:var(--g6);color:var(--g2)}
.chip-amber{background:var(--amber-bg);color:var(--amber)}
.chip-red{background:var(--red-bg);color:var(--red)}
.chip-blue{background:var(--blue-bg);color:var(--blue)}
.chip-gray{background:var(--s1);color:var(--soft)}
.btn-prim{background:var(--g1);color:#fff;border:none;border-radius:var(--r-sm);padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;transition:background .15s;width:100%}
.btn-prim:active{background:var(--g2)}
.btn-sec{background:var(--s1);color:var(--g1);border:1px solid var(--s3);border-radius:var(--r-sm);padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.overlay.show{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:800px;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,1.02,.6,1)}
.overlay.show .modal{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--s2);border-radius:99px;margin:12px auto 0}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;color:var(--g1);padding:10px 18px 14px;letter-spacing:.8px;border-bottom:1px solid var(--s2)}
.modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:13px}
.f-label{font-size:11px;color:var(--soft);font-weight:600;letter-spacing:.7px;text-transform:uppercase;margin-bottom:4px;display:block}
.f-in,.f-sel{width:100%;background:var(--s1);border:1.5px solid var(--s2);border-radius:var(--r-sm);color:var(--text);padding:10px 12px;font-size:14px;font-family:'Nunito',sans-serif;outline:none;transition:border-color .15s}
.f-in:focus,.f-sel:focus{border-color:var(--g3)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:#fff;border-radius:var(--r);border:1px solid var(--s2);box-shadow:var(--shadow);padding:28px 24px;width:100%;max-width:360px}
.login-logo{width:72px;height:72px;background:#fff;border-radius:50%;border:2px solid var(--s2);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;overflow:hidden}
.login-logo img{width:72px;height:72px;object-fit:cover;border-radius:50%}
.login-title{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;color:var(--g1);text-align:center;letter-spacing:1px;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--soft);text-align:center;margin-bottom:24px}
.user-btn{width:100%;padding:13px;border:1.5px solid var(--s2);border-radius:var(--r-sm);background:var(--s1);font-size:15px;font-weight:700;color:var(--text);cursor:pointer;font-family:'Nunito',sans-serif;margin-bottom:8px;transition:border-color .15s,background .15s;text-align:left;display:flex;align-items:center;gap:10px}
.user-btn:hover{border-color:var(--g3);background:var(--g6)}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--g2);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.empty{text-align:center;padding:40px 20px}
.empty-ic{font-size:40px;margin-bottom:10px}
.empty-txt{font-size:13px;color:var(--soft);font-weight:600}
.bar-wrap{background:var(--s1);border-radius:99px;height:8px;overflow:hidden;margin-top:6px}
.bar-fill{height:100%;border-radius:99px;background:var(--g3);transition:width .4s}
.bar-fill.danger{background:var(--red)}
.bar-fill.warn{background:var(--amber)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--g0);color:#fff;padding:9px 18px;border-radius:99px;font-size:12px;font-weight:700;z-index:400;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.fattura-row{padding:12px 14px;border-bottom:1px solid var(--s1);display:flex;flex-direction:column;gap:4px}
.fattura-row:last-child{border-bottom:none}
.fattura-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fattura-nome{font-weight:700;font-size:13px;color:var(--text)}
.fattura-importo{font-weight:700;font-size:14px}
.fattura-importo.passiva{color:var(--red)}
.fattura-importo.attiva{color:var(--g2)}
.fattura-meta{font-size:11px;color:var(--soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fattura-actions{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;align-items:center}
.btn-assign{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif}
.btn-assign.done{background:var(--g6);color:var(--g2);border-color:var(--s3)}
.mov-row{padding:11px 14px;border-bottom:1px solid var(--s1);display:flex;align-items:flex-start;gap:10px}
.mov-row:last-child{border-bottom:none}
.mov-desc{flex:1;font-size:12px;color:var(--text);line-height:1.4}
.mov-amount{font-weight:700;font-size:13px;white-space:nowrap}
.mov-date{font-size:10px;color:var(--soft);white-space:nowrap}
</style>
</head>

<script>
const USERS = ['Matteo','Commercialista'];
let _currentUser = null;
let _cantieri = [];
let _contabile = { fatture: [], movimenti: [] };
let _activeTab = 'flusso';
let _assegnaFatturaId = null;
let _toastTimer = null;

function fmt(n){ return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0); }
function fmtDec(n){ return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function showToast(msg, dur){
  dur = dur || 2400;
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { t.style.opacity = 0; }, dur);
}

function closeOv(e, id){
  if(e.target === e.currentTarget) document.getElementById(id).classList.remove('show');
}
function openModal(id){ document.getElementById(id).classList.add('show'); }

function doLogin(user){
  _currentUser = user;
  window._currentUser = user;
  localStorage.setItem('tbg_user', user);
  document.getElementById('scrLogin').style.display = 'none';
  document.getElementById('scrApp').style.display = 'flex';
  document.getElementById('btnUser').textContent = user[0].toUpperCase();
  document.getElementById('topbarSub').textContent = user;
  initApp();
}

function doLogout(){
  if(!confirm('Uscire da TB Gestione?')) return;
  localStorage.removeItem('tbg_user');
  location.reload();
}

function setFbDot(state){
  const d = document.getElementById('fbDot');
  d.className = 'fb-dot' + (state === 'ok' ? ' ok' : state === 'err' ? ' err' : '');
}

async function initApp(){
  setFbDot('');
  // Aspetta che il modulo Firebase sia pronto (max 3 secondi)
  let attempts = 0;
  while(!window._fbLoadCantieri && attempts < 30) {
    await new Promise(r => setTimeout(r, 100));
    attempts++;
  }
  try {
    const [cantieri, contabile] = await Promise.all([
      window._fbLoadCantieri ? window._fbLoadCantieri() : Promise.resolve([]),
      window._fbLoadContabile ? window._fbLoadContabile() : Promise.resolve({ fatture:[], movimenti:[] })
    ]);
    _cantieri = cantieri || [];
    _contabile = contabile || { fatture: [], movimenti: [], voci: [], saldoBanca: 0 };
    if(!_contabile.fatture) _contabile.fatture = [];
    if(!_contabile.movimenti) _contabile.movimenti = [];
    if(!_contabile.voci) _contabile.voci = [];
    if(_contabile.saldoBanca === undefined) _contabile.saldoBanca = 0;
    setFbDot('ok');
    if(window._fbListenContabile) {
      window._fbListenContabile(data => {
        _contabile = data || { fatture:[], movimenti:[], voci:[], saldoBanca:0 };
        if(!_contabile.fatture) _contabile.fatture = [];
        if(!_contabile.movimenti) _contabile.movimenti = [];
        if(!_contabile.voci) _contabile.voci = [];
        if(_contabile.saldoBanca === undefined) _contabile.saldoBanca = 0;
        renderTab(_activeTab);
      });
    }
  } catch(e) {
    console.warn('initApp error:', e);
    setFbDot('err');
  }
  renderTab(_activeTab);
}

function switchTab(tab){
  _activeTab = tab;
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('tab-' + tab);
  if(btn) btn.classList.add('active');
  renderTab(tab);
}

function renderTab(tab){
  if(tab === 'flusso') renderFlusso();
  else if(tab === 'fatture') renderFatture();
  else if(tab === 'banca') renderBanca();
  else if(tab === 'cantieri') renderCantieri();
  else if(tab === 'generali') renderGenerali();
}

function renderCantieri(){
  const fatture = _contabile.fatture || [];
  const voci = _contabile.voci || [];
  let html = '<div style="padding:14px 12px 6px;font-family:\'Barlow Condensed\',sans-serif;font-size:18px;font-weight:700;color:var(--g1);letter-spacing:.5px">RIEPILOGO CANTIERI</div>';
  const cant = _cantieri.filter(c => c.nome).sort((a,b) => (a.nome||'').localeCompare(b.nome||''));
  if(cant.length === 0) {
    html += '<div class="empty"><div class="empty-ic">🏗️</div><div class="empty-txt">Nessun cantiere trovato su Firebase</div></div>';
  } else {
    cant.forEach(function(c) {
      const costiDaFatture = fatture.filter(f => f.cantiereId===c.id && f.tipo==='passiva').reduce((s,f) => s+costoNetto(f), 0);
      const costiDaVoci = voci.filter(v => v.cantiereId===c.id).reduce((s,v) => s+(v.importo||0), 0);
      const costiTot = costiDaFatture + costiDaVoci;
      const costiIva = fatture.filter(f => f.cantiereId===c.id && f.tipo==='passiva').reduce((s,f) => s+(f.iva||0), 0);
      const costiLordi = fatture.filter(f => f.cantiereId===c.id && f.tipo==='passiva').reduce((s,f) => s+(f.totale||0), 0);
      const ricavi = calcolaContratto(c);
      const margine = ricavi > 0 ? ((ricavi - costiTot) / ricavi * 100) : null;
      const target = c.targetMargine || 20;
      const nFatture = fatture.filter(f => f.cantiereId===c.id).length;
      const chipCls = margine===null?'chip-gray':margine<target?'chip-red':margine<target+5?'chip-amber':'chip-green';
      const barCls = margine===null?'':margine<target?'danger':margine<target+5?'warn':'';
      const barW = margine!==null ? Math.min(100,Math.max(0,margine)) : 0;
      html += '<div class="section-card">';
      html += '<div class="section-head" style="background:linear-gradient(90deg,var(--g1),var(--g2));color:#fff"><span>' + c.nome + '</span><span class="chip" style="background:rgba(255,255,255,.2);color:#fff">' + (c.stato||'attivo') + '</span></div>';
      html += '<div style="padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px">';
      html += '<div><div class="kpi-label">Contratto</div><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:18px;font-weight:700;color:var(--g1)">' + fmt(ricavi) + '</div></div>';
      html += '<div><div class="kpi-label">Fatture assegnate</div><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:18px;font-weight:700">' + nFatture + '</div></div>';
      html += '</div>';
      if(costiTot > 0) {
        html += '<div style="display:flex;gap:0;margin:0 14px 12px;border:1px solid var(--s2);border-radius:6px;overflow:hidden;font-size:11px">';
        html += '<div style="flex:1;padding:8px 10px;background:var(--s1);border-right:1px solid var(--s2)"><div class="kpi-label">Costi (imp.)</div><div style="font-weight:700;color:var(--red);font-size:14px">' + fmt(costiTot) + '</div></div>';
        html += '<div style="flex:1;padding:8px 10px;background:var(--s1);border-right:1px solid var(--s2)"><div class="kpi-label">IVA</div><div style="font-weight:600;color:var(--soft);font-size:14px">' + fmt(costiIva) + '</div></div>';
        html += '<div style="flex:1;padding:8px 10px;background:var(--off)"><div class="kpi-label">Totale lordo</div><div style="font-weight:700;color:var(--text);font-size:14px">' + fmt(costiLordi) + '</div></div>';
        html += '</div>';
      }
      if(ricavi > 0) {
        html += '<div style="padding:0 14px 12px">';
        html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">';
        html += '<span style="font-size:12px;color:var(--soft)">Margine (su imponibile)</span>';
        html += '<span class="chip ' + chipCls + '">' + (margine!==null ? margine.toFixed(1)+'%' : '—') + '</span>';
        html += '</div>';
        html += '<div class="bar-wrap"><div class="bar-fill ' + barCls + '" style="width:' + barW + '%"></div></div>';
        html += '<div style="font-size:10px;color:var(--soft);margin-top:4px">Target: ' + target + '%</div>';
        html += '</div>';
      }
      html += '</div>';
    });
  }
  document.getElementById('mainContent').innerHTML = html;
}

function renderGenerali(){
  const fatture = (_contabile.fatture || []).filter(f => f.assegnazione === 'generale');
  const voci = (_contabile.voci || []).filter(v => v.assegnazione === 'generale');
  const totFatture = fatture.reduce((s,f) => s+costoNetto(f), 0);
  const totIva = fatture.reduce((s,f) => s+(f.iva||0), 0);
  const totLordo = fatture.reduce((s,f) => s+(f.totale||0), 0);
  const totVoci = voci.reduce((s,v) => s+(v.importo||0), 0);
  const totale = totFatture + totVoci;
  const perCat = {};
  fatture.forEach(function(f){ const k=f.categoria||'Altro'; perCat[k]=(perCat[k]||0)+costoNetto(f); });
  voci.forEach(function(v){ const k=v.categoria||'Altro'; perCat[k]=(perCat[k]||0)+(v.importo||0); });
  const catSorted = Object.entries(perCat).sort((a,b) => b[1]-a[1]);

  let html = '<div style="margin:14px 12px 8px;border:1px solid var(--s2);border-radius:var(--r-sm);overflow:hidden">';
  html += '<div style="display:flex;gap:0">';
  html += '<div style="flex:1;padding:10px 12px;background:var(--s1);border-right:1px solid var(--s2)"><div class="kpi-label">Imponibile</div><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:20px;font-weight:700;color:var(--red)">' + fmt(totale) + '</div></div>';
  html += '<div style="flex:1;padding:10px 12px;background:var(--s1);border-right:1px solid var(--s2)"><div class="kpi-label">IVA</div><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:20px;font-weight:700;color:var(--soft)">' + fmt(totIva) + '</div></div>';
  html += '<div style="flex:1;padding:10px 12px;background:var(--off)"><div class="kpi-label">Totale lordo</div><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:20px;font-weight:700;color:var(--text)">' + fmt(totLordo+totVoci) + '</div></div>';
  html += '</div></div>';
  html += '<div style="padding:0 12px 8px;display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  html += '<button onclick="apriNuovaVoce(\'pos\')" style="background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);border-radius:var(--r-sm);padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:\'Nunito\',sans-serif">✏️ + Voce manuale</button>';
  html += '<button onclick="esportaCommercialista()" style="background:var(--g1);color:#fff;border:none;border-radius:var(--r-sm);padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:\'Nunito\',sans-serif">📊 Export commercialista</button>';
  html += '<button onclick="apriCompensoSocio()" style="grid-column:1/-1;background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border);border-radius:var(--r-sm);padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:\'Nunito\',sans-serif">👤 + Compenso socio</button>';
  html += '</div>';
  if(catSorted.length > 0) {
    html += '<div class="section-card"><div class="section-head">Per categoria</div>';
    catSorted.forEach(function(e){ html += '<div class="row-item"><div class="row-main"><div class="row-name">' + e[0] + '</div></div><div class="row-amount neg">' + fmt(e[1]) + '</div></div>'; });
    html += '</div>';
  }
  html += '<div class="section-card"><div class="section-head"><span>🧾 Fatture generali</span><span class="chip chip-gray">' + fatture.length + '</span></div>';
  if(fatture.length === 0) {
    html += '<div class="empty"><div class="empty-ic">📋</div><div class="empty-txt">Nessuna fattura generale</div></div>';
  } else {
    html += '<div style="padding:8px 10px">';
    html += buildFattureTabella(fatture.slice().sort(function(a,b){ return (a.dataFattura||'').localeCompare(b.dataFattura||''); }), 'tutte', 'P');
    html += '</div>';
  }
  html += '</div>';
  if(voci.length > 0) {
    html += '<div class="section-card"><div class="section-head"><span>💳 Altre voci</span><span class="chip chip-amber">' + voci.length + '</span></div>';
    html += '<div style="padding:8px 10px">';
    html += buildVociTabella(voci.slice().sort(function(a,b){ return (a.data||'').localeCompare(b.data||''); }), 'V');
    html += '</div></div>';
  }
  document.getElementById('mainContent').innerHTML = html;
}

// Usa imponibile se disponibile, altrimenti totale (fallback per record senza IVA separata)
function costoNetto(f){ return f.imponibile && f.imponibile > 0 ? f.imponibile : (f.totale||0); }


// Calcola il valore del contratto: usa importo se impostato, altrimenti somma il computo
function calcolaContratto(c) {
  if(c.importo && c.importo > 0) return c.importo;
  // Somma le voci del computo (usa qtyEff se disponibile, come TB Cantieri)
  return (c.capitoli||[]).reduce((s, cap) => {
    return s + (cap.voci||[]).reduce((sv, v) => {
      const q = (v.qtyEff != null && v.qtyEff !== '') ? +v.qtyEff : (+v.qty||0);
      return sv + q * (+v.pu||0);
    }, 0);
  }, 0);
}

function renderFlusso(){
  const fatture = _contabile.fatture || [];
  const saldoBanca = _contabile.saldoBanca || 0;
  const daIncassare = fatture.filter(f => f.tipo==='attiva' && f.stato!=='pagata' && f.stato!=='riconciliata').reduce((s,f) => s+(f.totale||0), 0);
  const daPagare = fatture.filter(f => f.tipo==='passiva' && f.stato!=='pagata' && f.stato!=='riconciliata' && f.stato!=='annullata' && f.stato!=='annullata NC').reduce((s,f) => s+(f.totale||0), 0);
  const proiettato = saldoBanca + daIncassare - daPagare;
  const oggi = new Date().toISOString().slice(0,10);
  const tra7 = new Date(Date.now()+7*86400000).toISOString().slice(0,10);
  const scadenze = fatture.filter(f => f.scadenza && f.stato!=='pagata' && f.stato!=='riconciliata').sort((a,b) => a.scadenza.localeCompare(b.scadenza)).slice(0,6);
  const margini = _cantieri.filter(c => c.nome).map(c => {
    const costi = fatture.filter(f => f.cantiereId===c.id && f.tipo==='passiva').reduce((s,f) => s+costoNetto(f), 0);
    const contratto = calcolaContratto(c);
    const margine = contratto > 0 ? ((contratto - costi) / contratto * 100) : null;
    return { ...c, costiReali: costi, margine };
  }).sort((a,b) => {
    // Prima quelli con contratto (ordinati per margine crescente), poi senza
    if(a.margine !== null && b.margine !== null) return a.margine - b.margine;
    if(a.margine !== null) return -1;
    if(b.margine !== null) return 1;
    return (a.nome||'').localeCompare(b.nome||'');
  });

  let html = '<div class="kpi-grid">';
  html += '<div class="kpi-box"><div class="kpi-label">Saldo banca</div><div class="kpi-val">' + fmt(saldoBanca) + '</div></div>';
  html += '<div class="kpi-box"><div class="kpi-label">Da incassare</div><div class="kpi-val green">' + fmt(daIncassare) + '</div></div>';
  html += '<div class="kpi-box"><div class="kpi-label">Da pagare</div><div class="kpi-val red">' + fmt(daPagare) + '</div></div>';
  html += '<div class="kpi-box"><div class="kpi-label">Saldo proiettato</div><div class="kpi-val ' + (proiettato>=0?'green':'red') + '">' + fmt(proiettato) + '</div></div>';
  html += '</div>';

  html += '<div class="section-card"><div class="section-head"><span>⏰ Prossime scadenze</span><span style="font-size:11px;font-weight:400;color:var(--soft)">' + scadenze.length + ' in attesa</span></div>';
  if(scadenze.length === 0) {
    html += '<div class="empty"><div class="empty-ic">✅</div><div class="empty-txt">Nessuna scadenza in attesa</div></div>';
  } else {
    scadenze.forEach(function(f) {
      const isScaduta = f.scadenza < oggi;
      const isProx = !isScaduta && f.scadenza <= tra7;
      const colDot = isScaduta ? 'var(--red)' : isProx ? 'var(--amber)' : 'var(--g4)';
      const segno = f.tipo==='passiva' ? '−' : '+';
      const cls = f.tipo==='passiva' ? 'neg' : 'pos';
      const df = f.scadenza ? f.scadenza.split('-').reverse().join('/') : '';
      html += '<div class="row-item"><div class="row-dot" style="background:' + colDot + '"></div><div class="row-main"><div class="row-name">' + (f.fornitore||f.cliente||'—') + '</div><div class="row-sub">' + (f.numeroFattura||'') + (f.categoria?' · '+f.categoria:'') + '</div></div><div class="row-amount ' + cls + '">' + segno + fmt(f.totale) + '</div><div class="row-date">' + df + '</div></div>';
    });
  }
  html += '</div>';

  html += '<div class="section-card"><div class="section-head">🏗️ Margini cantieri</div>';
  if(margini.length === 0) {
    html += '<div class="empty"><div class="empty-ic">🏗️</div><div class="empty-txt">Nessun cantiere trovato</div></div>';
  } else {
    margini.forEach(function(c) {
      const target = c.targetMargine || 20;
      const hasMargine = c.margine !== null;
      const chipCls = !hasMargine ? 'chip-gray' : c.margine < target ? 'chip-red' : c.margine < target+5 ? 'chip-amber' : 'chip-green';
      const barCls = !hasMargine ? '' : c.margine < target ? 'danger' : c.margine < target+5 ? 'warn' : '';
      const barW = hasMargine ? Math.min(100, Math.max(0, c.margine)) : 0;
      const margineStr = hasMargine ? c.margine.toFixed(0)+'%' : '—';
      const subTxt = hasMargine
        ? 'contratto ' + fmt(calcolaContratto(c)) + ' · costi ' + fmt(c.costiReali)
        : 'nessun computo · costi ' + fmt(c.costiReali);
      html += '<div style="padding:12px 14px;border-bottom:1px solid var(--s1)">';
      html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:' + (hasMargine?'6':'2') + 'px">';
      html += '<div><div style="font-weight:700;font-size:13px">' + c.nome + '</div>';
      html += '<div style="font-size:11px;color:var(--soft)">' + subTxt + '</div></div>';
      html += '<span class="chip ' + chipCls + '">' + margineStr + '</span></div>';
      if(hasMargine) html += '<div class="bar-wrap"><div class="bar-fill ' + barCls + '" style="width:' + barW + '%"></div></div>';
      html += '</div>';
    });
  }
  html += '</div>';

  html += '<div style="padding:12px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn-sec" onclick="switchTab(\'fatture\')">🧾 Vedi fatture</button><button class="btn-sec" onclick="switchTab(\'banca\')">🏦 Vedi banca</button></div></div>';

  document.getElementById('mainContent').innerHTML = html;
}

function renderFatture(){
  const tuttefatture = (_contabile.fatture || []).slice().sort(function(a,b){ return (a.dataFattura||'').localeCompare(b.dataFattura||''); });
  const passive = tuttefatture.filter(function(f){ return f.tipo==='passiva'; });
  const attive  = tuttefatture.filter(function(f){ return f.tipo==='attiva'; });
  const nDaAssegnare = tuttefatture.filter(function(f){ return !f.assegnazione && f.tipdoc !== 'NC'; }).length;

  // Stato filtro corrente
  var filtro = window._fattFiltro || 'tutte';

  var html = '<div style="padding:12px 12px 4px;display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  html += '</div>';
  if(nDaAssegnare > 0) html += '<div style="padding:0 12px 6px"><button onclick="assegnaAutomatica()" style="width:100%;background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border);border-radius:var(--r-sm);padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:\'Nunito\',sans-serif">🤖 Suggerisci assegnazioni automatiche (' + nDaAssegnare + ')</button></div>';
  html += '<div style="padding:0 12px 8px"><button onclick="apriNuovaVoce(\'fattura_passiva\')" style="width:100%;background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);border-radius:var(--r-sm);padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:\'Nunito\',sans-serif">✏️ + Fattura manuale</button></div>';
  if(_contabile.updatedAt) html += '<div style="text-align:center;font-size:10px;color:var(--soft);padding:4px 0">Ultimo aggiornamento: ' + new Date(_contabile.updatedAt).toLocaleDateString('it-IT') + '</div>';
  if(tuttefatture.length > 0) html += '<div style="text-align:center;font-size:11px;color:var(--soft);padding:2px 0 8px">' + tuttefatture.length + ' fatture · ' + tuttefatture.filter(function(f){ return f.assegnazione; }).length + ' assegnate</div>';

  // Filtri cantiere
  var centri = ['tutte'];
  tuttefatture.forEach(function(f){
    var c = f.assegnazione==='cantiere' ? ((_cantieri.find(function(x){ return x.id===f.cantiereId; })||{}).nome||'?') : f.assegnazione==='generale' ? 'Generale' : '';
    if(c && centri.indexOf(c)===-1) centri.push(c);
  });
  centri.push('da assegnare');
  html += '<div style="padding:0 12px 8px;display:flex;gap:6px;flex-wrap:wrap;overflow-x:auto">';
  centri.forEach(function(c){
    var isActive = filtro===c;
    html += '<button onclick="window._fattFiltro=\''+c+'\';renderFatture()" style="flex:none;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;font-family:\'Nunito\',sans-serif;border:1px solid '+(isActive?'var(--g1)':'var(--s2)')+';background:'+(isActive?'var(--g1)':'#fff')+';color:'+(isActive?'#fff':'var(--soft)')+'">'+c+'</button>';
  });
  html += '</div>';

  // Tabella passive
  html += '<div style="padding:0 12px 4px"><div style="font-size:11px;font-weight:700;color:var(--soft);padding:4px 0 6px">📤 FATTURE PASSIVE (FORNITORI) <span style="background:var(--red-bg);color:var(--red);padding:2px 7px;border-radius:10px;font-size:10px">'+passive.length+'</span></div>';
  html += buildFattureTabella(passive, filtro, 'P');
  html += '</div>';

  // Tabella attive
  html += '<div style="padding:0 12px 16px"><div style="font-size:11px;font-weight:700;color:var(--soft);padding:4px 0 6px">📥 FATTURE ATTIVE (CLIENTI) <span style="background:var(--g6);color:var(--g2);padding:2px 7px;border-radius:10px;font-size:10px">'+attive.length+'</span></div>';
  html += buildFattureTabella(attive, filtro, 'A');
  html += '</div>';

  document.getElementById('mainContent').innerHTML = html;
}

function buildFattureTabella(fatture, filtro, prefisso) {
  // Filtra
  var filtered = fatture.filter(function(f, i){
    if(filtro==='tutte') return true;
    if(filtro==='da assegnare') return !f.assegnazione;
    if(filtro==='Generale') return f.assegnazione==='generale';
    var cantNome = (_cantieri.find(function(x){ return x.id===f.cantiereId; })||{}).nome||'';
    return cantNome === filtro;
  });

  if(!filtered.length) return '<div style="text-align:center;padding:16px;font-size:12px;color:var(--soft)">Nessuna fattura per questo filtro.</div>';

  var totImp=0, totIva=0, totTot=0;
  filtered.forEach(function(f){ totImp+=(f.imponibile||0); totIva+=(f.iva||0); totTot+=(f.totale||0); });

  var tbl = '<div style="overflow-x:auto;border-radius:10px;border:1px solid var(--s2)">';
  tbl += '<table style="width:100%;border-collapse:collapse;font-size:11px;min-width:780px">';
  tbl += '<thead><tr style="background:var(--s1);border-bottom:1px solid var(--s2)">';
  var cols = ['#','Data','Fornitore / Cliente','N. Fatt.','Imponibile','IVA %','IVA €','Totale','Centro','Stato',''];
  var aligns = ['c','l','l','l','r','r','r','r','l','c','c'];
  cols.forEach(function(c,i){

function triggerImportExcel(){ document.getElementById('inputExcel').click(); }

async function importExcel(input){
  const file = input.files[0];
  if(!file) return;
  showToast('⏳ Lettura Excel in corso…', 60000);
  try {
    const data = await new Promise(function(res, rej){
      const r = new FileReader();
      r.onload = function(e){ res(e.target.result); };
      r.onerror = function(){ rej(new Error('Lettura file fallita')); };
      r.readAsArrayBuffer(file);
    });
    if(typeof XLSX === 'undefined'){ showToast('❌ Libreria Excel non caricata'); return; }
    const wb = XLSX.read(data, { type: 'array' });
    const importSheetName = wb.SheetNames.find(function(n){ return n.indexOf('IMPORT') !== -1; });
    if(!importSheetName){ showToast('❌ Foglio IMPORT non trovato'); return; }
    const importSheet = wb.Sheets[importSheetName];
    const rows = XLSX.utils.sheet_to_json(importSheet, { header: 1, defval: null });
    let headerIdx = -1;
    for(let i = 0; i < rows.length; i++){
      if(rows[i] && rows[i].indexOf('tipo') !== -1){ headerIdx = i; break; }
    }
    if(headerIdx < 0){ showToast('❌ Header non trovato nel foglio IMPORT'); return; }
    const headers = rows[headerIdx];
    const col = function(name){ return headers.indexOf(name); };
    const voci = [], fatture = [];
    let nuovoSaldoBanca = _contabile.saldoBanca || 0;
    console.log('Import Excel — cantieri disponibili:', _cantieri.length, _cantieri.map(c=>(c.nome||'?')+'('+c.id+')').join(', '));
    for(let i = headerIdx + 1; i < rows.length; i++){
      const row = rows[i];
      if(!row || !row[col('tipo')]) continue;
      const tipo = String(row[col('tipo')]||'').trim();
      const desc = String(row[col('descrizione')]||'').trim();
      const importo = parseFloat(row[col('importo')])||0;
      const centro = String(row[col('centro')]||'generale').trim().toLowerCase();
      const categoria = String(row[col('categoria')]||'').trim();
      const data = parseDataExcel(row[col('data')] ? String(row[col('data')]).trim() : '');
      const numero = row[col('numero')] ? String(row[col('numero')]).trim() : '';
      const id = 'xls_' + tipo + '_' + importo + '_' + (data||'') + '_' + (desc||'').slice(0,20).replace(/\s+/g,'');
      if(tipo === 'saldo_banca') {
        nuovoSaldoBanca = importo;
        continue;
      }
      // Match cantiere: prima per ID esplicito (campo cantiere_id), poi per nome
      const cantiereIdEsplicito = row[col('cantiere_id')] ? String(row[col('cantiere_id')]).trim() : null;
      const cant = cantiereIdEsplicito
        ? _cantieri.find(function(c){ return c.id === cantiereIdEsplicito; })
        : _cantieri.find(function(c){
            if(!c.nome) return false;
            const nomeC = c.nome.toUpperCase().replace(/[^A-Z0-9]/g,' ').trim();
            const centroU = centro.toUpperCase().replace(/[^A-Z0-9]/g,' ').trim();
            // Match per parole significative (min 4 caratteri) presenti in entrambi
            return nomeC.split(' ').some(function(w){
              return w.length >= 4 && centroU.indexOf(w) !== -1;
            }) || centroU.split(' ').some(function(w){
              return w.length >= 4 && nomeC.indexOf(w) !== -1;
            });
          });
      if(tipo === 'movimento_conto') {
        // Movimento di cassa puro (es. addebito Nexi, ricarica Kuwait):
        // già coperto da voci singole — non genera costi, solo flusso cassa
        continue;
      }
      if(tipo === 'fattura_passiva' || tipo === 'fattura_attiva') {
        // Legge imponibile e iva_pct dalle nuove colonne (se presenti), altrimenti fallback su importo
        const imponibileRaw = row[col('imponibile')];
        const ivaPctRaw = row[col('iva_pct')];
        const imponibile = (imponibileRaw !== null && imponibileRaw !== undefined) ? parseFloat(imponibileRaw)||0 : importo;
        const aliquotaIva = (ivaPctRaw !== null && ivaPctRaw !== undefined) ? parseFloat(ivaPctRaw)||0 : 0;
        const iva = Math.round((importo - imponibile) * 100) / 100;
        // Per le fatture passive, la colonna 'categoria' contiene lo STATO (pagata/da pagare/ecc)
        // La categoria merceologica non è nel foglio IMPORT (viene assegnata manualmente in TB Gestione)
        const statoFattura = tipo==='fattura_attiva' ? 'riconciliata' : categoria === 'da pagare' ? 'assegnata' :
                             categoria === 'annullata NC' ? 'annullata' :
                             categoria === 'pagata' ? 'pagata' :
                             categoria === 'riconciliata' ? 'riconciliata' : 'assegnata';
        fatture.push({ id:id, fonte:'excel', tipo:tipo==='fattura_attiva'?'attiva':'passiva', tipdoc:'FA',
          numeroFattura:numero, dataFattura:data,
          fornitore:tipo==='fattura_passiva'?desc.split(' - Fatt.')[0]:'',
          cliente:tipo==='fattura_attiva'?desc.split(' - Fatt.')[0]:'',
          totale:importo, imponibile:imponibile, iva:iva, aliquotaIva:aliquotaIva,
          assegnazione:centro==='generale'||centro==='fisco'?'generale':'cantiere',
          cantiereId:cant?cant.id:null, categoria:'', stato:statoFattura,
          note:desc, createdAt:Date.now() });
      } else {
        const tipoVoce = tipo==='fisco'?'fisco':tipo==='compenso'?'compenso':tipo==='costo_generale'?'costo_generale':'costo_pos';
        voci.push({ id:id, tipoVoce:tipoVoce, descrizione:desc, data:data, importo:importo,
          assegnazione:centro==='generale'||centro==='fisco'?'generale':'cantiere',
          cantiereId:cant?cant.id:null, categoria:categoria, note:'', fonte:'excel', createdAt:Date.now() });
      }
    }
    const vociFiltrate = (_contabile.voci||[]).filter(function(v){ return v.fonte!=='excel'; });
    const fattureFiltrate = (_contabile.fatture||[]).filter(function(f){ return f.fonte!=='excel'; });
    // Deduplication: rimuovi voci/fatture con stesso ID (reimport dello stesso Excel)
    const idsVoci = new Set(vociFiltrate.map(function(v){ return v.id; }));
    const idsFatture = new Set(fattureFiltrate.map(function(f){ return f.id; }));
    const vociUniche = voci.filter(function(v){ return !idsVoci.has(v.id); });
    const fattureUniche = fatture.filter(function(f){ return !idsFatture.has(f.id); });
    if(voci.length !== vociUniche.length || fatture.length !== fattureUniche.length) {
      console.warn('Import: ' + (voci.length - vociUniche.length) + ' voci e ' + (fatture.length - fattureUniche.length) + ' fatture duplicate ignorati');
    }
    const nuoveVoci = vociFiltrate.concat(vociUniche);
    const nuoveFatture = fattureFiltrate.concat(fattureUniche);
    _contabile.voci = nuoveVoci;
    _contabile.fatture = nuoveFatture;
    _contabile.saldoBanca = nuovoSaldoBanca;
    _contabile.ultimoImportPeriodo = file.name.replace(/\.xlsx?$/,'').replace('TB_Riconciliazione_','').replace(/_DEFINITIVO.*/,'');
    await window._fbSaveContabile({ fatture:nuoveFatture, movimenti:_contabile.movimenti||[], voci:nuoveVoci, saldoBanca:nuovoSaldoBanca, ultimoImportPeriodo:_contabile.ultimoImportPeriodo });
    showToast('✅ ' + fattureUniche.length + ' fatture · ' + vociUniche.length + ' voci · saldo ' + fmtDec(nuovoSaldoBanca));
    renderBanca();
  } catch(e) {
    console.error('importExcel error:', e);
    showToast('❌ Errore import Excel: ' + e.message);
  }
  input.value = '';
}

function parseDataExcel(s){
  if(!s) return '';
  const m1 = s.match(/(\d{2})[\/](\d{2})[\/](\d{4})/);
  if(m1) return m1[3]+'-'+m1[2]+'-'+m1[1];
  if(s.match(/\d{4}-\d{2}-\d{2}/)) return s;
  return s;
}

async function salvaCompensoSocio(){
  const socio = document.getElementById('cs-socio').value;
  const mese = document.getElementById('cs-mese').value;
  const importo = parseFloat(document.getElementById('cs-importo').value);
  if(!mese){ showToast('Seleziona il mese'); return; }
  if(!importo){ showToast('Inserisci l\'importo'); return; }
  const inputs = document.querySelectorAll('#cs-cantieri-list input[type=number]');
  let totPct = 0;
  const ripartizioni = [];
  inputs.forEach(function(inp){
    const pct = parseFloat(inp.value)||0;
    totPct += pct;
    if(pct > 0) ripartizioni.push({ cantiereId: inp.dataset.cantiereId, pct: pct });
  });
  if(totPct > 100){ showToast('La somma delle % supera 100'); return; }
  const pctGenerale = 100 - totPct;
  const voci = _contabile.voci ? _contabile.voci.slice() : [];
  ripartizioni.forEach(function(r){
    const cant = _cantieri.find(function(c){ return c.id === r.cantiereId; });
    voci.push({ id: 'comp_'+uid(), fonte:'manuale', tipoVoce:'compenso', descrizione:'Compenso '+socio+' — '+mese,
      data: mese+'-01', importo: Math.round(importo*r.pct/100*100)/100,
      assegnazione:'cantiere', cantiereId:r.cantiereId, categoria:'Compenso socio',
      note: r.pct+'% su '+(cant?cant.nome:''), createdAt:Date.now() });
  });
  if(pctGenerale > 0) {
    voci.push({ id: 'comp_'+uid(), fonte:'manuale', tipoVoce:'compenso', descrizione:'Compenso '+socio+' — '+mese,
      data: mese+'-01', importo: Math.round(importo*pctGenerale/100*100)/100,
      assegnazione:'generale', cantiereId:null, categoria:'Compenso socio',
      note: pctGenerale+'% costi generali', createdAt:Date.now() });
  }
  _contabile.voci = voci;
  await window._fbSaveContabile({ fatture:_contabile.fatture||[], movimenti:_contabile.movimenti||[], voci:voci });
  document.getElementById('mCompensoSocio').classList.remove('show');
  showToast('✅ Compenso '+socio+' salvato');
  renderTab(_activeTab);
}

function esportaCommercialista(){
  if(typeof XLSX === 'undefined'){ showToast('❌ Libreria Excel non caricata'); return; }
  const wb = XLSX.utils.book_new();
  const oggi = new Date().toLocaleDateString('it-IT');

  // Foglio fatture passive
  const passive = (_contabile.fatture||[]).filter(function(f){ return f.tipo==='passiva'; }).sort(function(a,b){ return (a.dataFattura||'').localeCompare(b.dataFattura||''); });
  const rowsPassive = [['Data','N° Fattura','Fornitore','Imponibile €','IVA €','Totale €','Centro di costo','Categoria','Fonte']];
  passive.forEach(function(f){
    const cantNome = f.assegnazione==='cantiere' ? ((_cantieri.find(function(c){ return c.id===f.cantiereId; })||{}).nome||'?') : 'Generale';
    rowsPassive.push([f.dataFattura||'',f.numeroFattura||'',f.fornitore||'',f.imponibile||0,f.iva||0,f.totale||0,cantNome,f.categoria||'',f.fonte||'manuale']);
  });
  rowsPassive.push(['','','TOTALE','=SUM(D2:D'+passive.length+')','=SUM(E2:E'+passive.length+')','=SUM(F2:F'+passive.length+')','','','']);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rowsPassive), '🧾 Fatture Passive');

  // Foglio fatture attive
  const attive = (_contabile.fatture||[]).filter(function(f){ return f.tipo==='attiva'; }).sort(function(a,b){ return (a.dataFattura||'').localeCompare(b.dataFattura||''); });
  const rowsAttive = [['Data','N° Fattura','Cliente','Imponibile €','IVA €','Totale €','Ritenuta €','Note']];
  attive.forEach(function(f){
    rowsAttive.push([f.dataFattura||'',f.numeroFattura||'',f.cliente||'',f.imponibile||0,f.iva||0,f.totale||0,f.ritenuta||0,f.note||'']);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rowsAttive), '📤 Fatture Attive');

  // Foglio altre voci
  const voci = (_contabile.voci||[]).sort(function(a,b){ return (a.data||'').localeCompare(b.data||''); });
  const rowsVoci = [['Data','Tipo','Descrizione','Importo €','Centro di costo','Categoria','Note']];
  voci.forEach(function(v){
    const cantNome = v.assegnazione==='cantiere' ? ((_cantieri.find(function(c){ return c.id===v.cantiereId; })||{}).nome||'?') : 'Generale';
    const tipoLabel = { pos:'POS/Spesa diretta', f24:'F24/Imposta', compenso:'Compenso socio', banca:'Commissione banca', altro:'Altro' }[v.tipoVoce]||v.tipoVoce||'';
    rowsVoci.push([v.data||'',tipoLabel,v.descrizione||'',v.importo||0,cantNome,v.categoria||'',v.note||'']);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rowsVoci), '💸 Altre Voci');

  // Foglio riepilogo
  const totPassive = passive.reduce(function(s,f){ return s+costoNetto(f); }, 0);
  const totAttive = attive.reduce(function(s,f){ return s+(f.totale||0); }, 0);
  const totVoci = voci.reduce(function(s,v){ return s+(v.importo||0); }, 0);
  const rowsRiep = [
    ['RIEPILOGO CONTABILE — TECNOBASE RESTAURI SRL',''],
    ['Generato il', oggi],
    ['',''],
    ['ENTRATE',''],
    ['Fatture attive (SAL)', totAttive],
    ['',''],
    ['USCITE',''],
    ['Fatture passive (fornitori)', totPassive],
    ['Altre voci (POS, F24, compensi, ecc.)', totVoci],
    ['Totale uscite', totPassive + totVoci],
    ['',''],
    ['RISULTATO',''],
    ['Margine lordo', totAttive - totPassive - totVoci]
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rowsRiep), '📊 Riepilogo');

  XLSX.writeFile(wb, 'TB_Gestione_' + new Date().toISOString().slice(0,10) + '.xlsx');
  showToast('✅ Export generato');
}

function suggerisciAssegnazione(f){
  if(!f || f.assegnazione) return null;
  if((f.tipdoc||'').toUpperCase() === 'NC') return null;
  const nomeContatto = (f.fornitore || f.cliente || '').toUpperCase();

  // 1. Fatture attive: confronta nome cliente con nomi cantieri
  if(f.tipo === 'attiva') {
    for(var i = 0; i < _cantieri.length; i++){
      const c = _cantieri[i];
      if(!c.nome) continue;
      const nomeCant = c.nome.toUpperCase();
      // Cerca parole chiave del cantiere nel nome cliente e viceversa
      const wordsCant = nomeCant.split(/\s+/).filter(function(w){ return w.length > 3; });
      const wordsContatto = nomeContatto.split(/\s+/).filter(function(w){ return w.length > 3; });
      const match = wordsCant.some(function(w){ return nomeContatto.indexOf(w) !== -1; }) ||
                    wordsContatto.some(function(w){ return nomeCant.indexOf(w) !== -1; });
      if(match) return { tipo: 'cantiere', cantiereId: c.id, label: c.nome, categoria: 'SAL/Acconto' };
    }
  }

  // 2. Fatture passive: guarda storico assegnazioni dello stesso fornitore
  const storicoFornitore = (_contabile.fatture||[]).filter(function(x){
    return x.assegnazione && x.fornitore === f.fornitore && x.id !== f.id;
  });
  if(storicoFornitore.length > 0) {
    // Prende l'assegnazione più frequente
    const freq = {};
    storicoFornitore.forEach(function(x){
      const key = x.assegnazione + '|' + (x.cantiereId||'') + '|' + (x.categoria||'');
      freq[key] = (freq[key]||0) + 1;
    });
    const best = Object.entries(freq).sort(function(a,b){ return b[1]-a[1]; })[0];
    if(best) {
      const parts = best[0].split('|');
      const tipo = parts[0], cantiereId = parts[1], categoria = parts[2];
      if(tipo === 'cantiere' && cantiereId) {
        const cant = _cantieri.find(function(c){ return c.id === cantiereId; });
        if(cant) return { tipo: 'cantiere', cantiereId: cantiereId, label: cant.nome, categoria: categoria };
      }
      if(tipo === 'generale') return { tipo: 'generale', cantiereId: null, label: 'Generale', categoria: categoria };
    }
  }

  // 3. Fatture passive: confronto nome fornitore con nomi cantieri (es. fornitore locale)
  if(f.tipo === 'passiva') {
    for(var j = 0; j < _cantieri.length; j++){
      const c2 = _cantieri[j];
      if(!c2.nome) continue;
      const nomeCant2 = c2.nome.toUpperCase();
      const wordsCant2 = nomeCant2.split(/\s+/).filter(function(w){ return w.length > 4; });
      if(wordsCant2.some(function(w){ return nomeContatto.indexOf(w) !== -1; }))
        return { tipo: 'cantiere', cantiereId: c2.id, label: c2.nome, categoria: '' };
    }
  }

  return null;
}

async function assegnaAutomatica(){
  const fattureDaAssegnare = (_contabile.fatture||[]).filter(function(f){
    return !f.assegnazione && (f.tipdoc||'').toUpperCase() !== 'NC';
  });
  const suggerimenti = fattureDaAssegnare.map(function(f){
    return { f: f, sug: suggerisciAssegnazione(f) };
  }).filter(function(x){ return x.sug !== null; });

  if(suggerimenti.length === 0){
    showToast('⚠️ Nessun suggerimento disponibile');
    return;
  }

  if(!confirm('Trovati ' + suggerimenti.length + ' suggerimenti automatici.\n\nVerranno pre-assegnate le fatture — potrai riassegnare quelle errate.\n\nProcedere?')) return;

  let fatture = _contabile.fatture.slice();
  suggerimenti.forEach(function(item){
    fatture = fatture.map(function(f){
      if(f.id !== item.f.id) return f;
      return Object.assign({}, f, {
        assegnazione: item.sug.tipo,
        cantiereId: item.sug.cantiereId || null,
        categoria: item.sug.categoria || f.categoria || '',
        stato: 'assegnata'
      });
    });
  });
  _contabile.fatture = fatture;
  await window._fbSaveContabile({ fatture: fatture, movimenti: _contabile.movimenti||[], voci: _contabile.voci||[] });
  showToast('✅ ' + suggerimenti.length + ' fatture assegnate automaticamente');
  renderFatture();
}
