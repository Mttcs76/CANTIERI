<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, setDoc, getDoc, getDocs, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyDvXu1k4kPWBDnmBZxDs6McM9fqntMMphw",
  authDomain: "tb-cantieri.firebaseapp.com",
  projectId: "tb-cantieri",
  storageBucket: "tb-cantieri.firebasestorage.app",
  messagingSenderId: "91212110377",
  appId: "1:91212110377:web:cbb842678fb0d311a79a38"
};
let fbDb = null;
try {
  const fbApp = initializeApp(firebaseConfig);
  fbDb = getFirestore(fbApp);
  window._fbDb = fbDb;
  window._fbEnabled = true;
} catch(e) { window._fbEnabled = false; }

window._fbLoadCantieri = async () => {
  if (!fbDb) return [];
  try {
    const snap = await getDocs(collection(fbDb, 'tbcantieri_v2'));
    const cantieri = [];
    snap.forEach(d => {
      if (d.id !== '__globali' && d.id !== '__contabile') cantieri.push({ id: d.id, ...d.data() });
    });
    return cantieri;
  } catch(e) { return []; }
};

window._fbLoadContabile = async () => {
  if (!fbDb) return null;
  try {
    const snap = await getDoc(doc(fbDb, 'tbcantieri_v2', '__contabile'));
    return snap.exists() ? snap.data() : { fatture: [], movimenti: [], updatedAt: null };
  } catch(e) { return { fatture: [], movimenti: [], updatedAt: null }; }
};

window._fbSaveContabile = async (data) => {
  if (!fbDb) return;
  try {
    await setDoc(doc(fbDb, 'tbcantieri_v2', '__contabile'), {
      ...data,
      updatedAt: Date.now(),
      updatedBy: window._currentUser || 'Matteo'
    }, { merge: true });
  } catch(e) { console.warn('fbSaveContabile error:', e); }
};

window._fbListenContabile = (cb) => {
  if (!fbDb) return;
  onSnapshot(doc(fbDb, 'tbcantieri_v2', '__contabile'), snap => {
    cb(snap.exists() ? snap.data() : { fatture: [], movimenti: [] });
  });
};
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Nunito:wght@400;500;600;700;800&display=swap');

<script>
const USERS = ['Matteo','Assistente'];
let _currentUser = null;
let _cantieri = [];
let _contabile = { fatture: [], movimenti: [] };
let _activeTab = 'flusso';
let _assegnaFatturaId = null;
let _toastTimer = null;

function fmt(n){ return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0); }
function fmtDec(n){ return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function showToast(msg, dur){
  dur = dur || 2400;
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { t.style.opacity = 0; }, dur);
}

function closeOv(e, id){
  if(e.target === e.currentTarget) document.getElementById(id).classList.remove('show');
}
function openModal(id){ document.getElementById(id).classList.add('show'); }

function doLogin(user){
  _currentUser = user;
  window._currentUser = user;
  localStorage.setItem('tbg_user', user);
  document.getElementById('scrLogin').style.display = 'none';
  document.getElementById('scrApp').style.display = 'flex';
  document.getElementById('btnUser').textContent = user[0].toUpperCase();
  document.getElementById('topbarSub').textContent = user;
  initApp();
}

function doLogout(){
  if(!confirm('Uscire da TB Gestione?')) return;
  localStorage.removeItem('tbg_user');
  location.reload();
}

function setFbDot(state){
  const d = document.getElementById('fbDot');
  d.className = 'fb-dot' + (state === 'ok' ? ' ok' : state === 'err' ? ' err' : '');
}

async function initApp(){
  setFbDot('');
  try {
    const [cantieri, contabile] = await Promise.all([
      window._fbLoadCantieri ? window._fbLoadCantieri() : Promise.resolve([]),
      window._fbLoadContabile ? window._fbLoadContabile() : Promise.resolve({ fatture:[], movimenti:[] })
    ]);
    _cantieri = cantieri || [];
    _contabile = contabile || { fatture: [], movimenti: [] };
    if(!_contabile.fatture) _contabile.fatture = [];
    if(!_contabile.movimenti) _contabile.movimenti = [];
    setFbDot('ok');
    if(window._fbListenContabile) {
      window._fbListenContabile(data => {
        _contabile = data || { fatture:[], movimenti:[] };
        if(!_contabile.fatture) _contabile.fatture = [];
        if(!_contabile.movimenti) _contabile.movimenti = [];
        renderTab(_activeTab);
      });
    }
  } catch(e) {
    console.warn('initApp error:', e);
    setFbDot('err');
  }
  renderTab(_activeTab);
}

function switchTab(tab){
  _activeTab = tab;
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('tab-' + tab);
  if(btn) btn.classList.add('active');
  renderTab(tab);
}

function renderTab(tab){
  if(tab === 'flusso') renderFlusso();
  else if(tab === 'fatture') renderFatture();
  else if(tab === 'banca') renderBanca();
  else if(tab === 'cantieri') renderCantieri();
  else if(tab === 'generali') renderGenerali();
}

function renderFlusso(){
  const fatture = _contabile.fatture || [];
  const movimenti = _contabile.movimenti || [];
  const daIncassare = fatture.filter(f => f.tipo==='attiva' && f.stato!=='pagata' && f.stato!=='riconciliata').reduce((s,f) => s+(f.totale||0), 0);
  const daPagare = fatture.filter(f => f.tipo==='passiva' && f.stato!=='pagata' && f.stato!=='riconciliata').reduce((s,f) => s+(f.totale||0), 0);
  const saldoBanca = movimenti.reduce((s,m) => s+(m.importo||0), 0);
  const proiettato = saldoBanca + daIncassare - daPagare;
  const oggi = new Date().toISOString().slice(0,10);
  const tra7 = new Date(Date.now()+7*86400000).toISOString().slice(0,10);
  const scadenze = fatture.filter(f => f.scadenza && f.stato!=='pagata' && f.stato!=='riconciliata').sort((a,b) => a.scadenza.localeCompare(b.scadenza)).slice(0,6);
  const margini = _cantieri.filter(c => c.nome && c.importo > 0).map(c => {
    const costi = fatture.filter(f => f.cantiereId===c.id && f.tipo==='passiva').reduce((s,f) => s+(f.totale||0), 0);
    const margine = ((c.importo - costi) / c.importo * 100);
    return { ...c, costiReali: costi, margine };
  }).sort((a,b) => a.margine - b.margine);

  let html = '<div class="kpi-grid">';
  html += '<div class="kpi-box"><div class="kpi-label">Saldo banca</div><div class="kpi-val">' + fmt(saldoBanca) + '</div></div>';

  const cantNome = assegnata && f.assegnazione === 'cantiere' ? ((_cantieri.find(c => c.id === f.cantiereId)||{}).nome||'?') : '';
  let row = '<div class="fattura-row">';
  row += '<div class="fattura-top"><div class="fattura-nome">' + (f.fornitore||f.cliente||'—') + '</div><div class="fattura-importo ' + f.tipo + '">' + fmtDec(f.totale) + '</div></div>';

  if(f.aliquotaIva !== undefined) row += '<span>IVA ' + f.aliquotaIva + '%</span>';

  row += '</div></div>';
  return row;
}

function triggerImportZip(){ document.getElementById('inputZip').click(); }
function triggerImportCsv(){ document.getElementById('inputCsv').click(); }

async function importZip(input){
  const file = input.files[0];
  if(!file) return;
  showToast('⏳ Lettura ZIP in corso…', 60000);
  try {
    const zip = await JSZip.loadAsync(file);
    const docXml = await readZipEntry(zip, 'su_docume_m.xml');
    const contXml = await readZipEntry(zip, 'ba_contact.xml');
    if(!docXml){ showToast('❌ File su_docume_m.xml non trovato nello ZIP'); return; }
    const anag = parseContatti(contXml || '');
    const fatture = parseDocumenti(docXml, anag);
    const existing = _contabile.fatture || [];
    const existingIds = new Set(existing.map(f => f.id));
    const nuove = fatture.filter(f => !existingIds.has(f.id));
    const merged = existing.concat(nuove);
    _contabile.fatture = merged;
    await window._fbSaveContabile({ fatture: merged, movimenti: _contabile.movimenti || [] });
    showToast('✅ ' + nuove.length + ' fatture importate (' + (fatture.length - nuove.length) + ' già presenti)');
    renderFatture();
  } catch(e) {
    console.error('importZip error:', e);
    showToast('❌ Errore import ZIP: ' + e.message);
  }
  input.value = '';
}

async function readZipEntry(zip, name){
  const entry = Object.values(zip.files).find(function(f){ return !f.dir && f.name.indexOf(name) !== -1; });
  if(!entry) return null;
  return entry.async('string');
}

function parseContatti(xml){
  const map = {};
  try {
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    doc.querySelectorAll('ROW').forEach(function(r){
      const cod = txtEl(r,'COCODSOG');
      const nome = txtEl(r,'CORAGSO1') || txtEl(r,'COCGNOME') || '';
      if(cod) map[cod] = nome;
    });
  } catch(e){}
  return map;
}

function parseDocumenti(xml, anag){
  const fatture = [];
  try {
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    doc.querySelectorAll('ROW').forEach(function(r){
      const tipdoc = txtEl(r,'DOTIPDOC') || 'FA';
      const tipsog = txtEl(r,'DOTIPSOG') || '';
      const codSog = txtEl(r,'DOCODSOG') || '';
      const numDoc = txtEl(r,'DONUMDOCACQ') || txtEl(r,'DONUMDOC') || '';
      const datDoc = parseDateTIC(txtEl(r,'DODATDOC') || '');
      const imponibile = parseFloatIT(txtEl(r,'DOIMPIVA') || '0');
      const iva = parseFloatIT(txtEl(r,'DOTOTIVA') || '0');
      const totale = parseFloatIT(txtEl(r,'DOTOTDOC') || '0');
      const ritenuta = parseFloatIT(txtEl(r,'DOIMPRIT') || '0');
      const nomeContatto = anag[codSog] || codSog || 'Sconosciuto';
      const tipo = tipsog === 'CLI' ? 'attiva' : 'passiva';
      const id = 'tic_' + (numDoc || uid()) + '_' + (datDoc || uid());
      fatture.push({
        id: id, fonte: 'tic', tipo: tipo, tipdoc: tipdoc,
        numeroFattura: numDoc, dataFattura: datDoc,
        fornitore: tipo === 'passiva' ? nomeContatto : '',
        cliente: tipo === 'attiva' ? nomeContatto : '',
        codFornitore: codSog,
        imponibile: imponibile, iva: iva, totale: totale, ritenuta: ritenuta,
        aliquotaIva: imponibile > 0 ? Math.round(iva / imponibile * 100) : 0,
        stato: 'importata', assegnazione: null, cantiereId: null, categoria: null,
        createdAt: Date.now()
      });
    });
  } catch(e){ console.warn('parseDocumenti error:', e); }
  return fatture;
}

function txtEl(el, tag){ const n = el.querySelector(tag); return n ? n.textContent.trim() : ''; }
function parseFloatIT(s){ return parseFloat((s||'0').replace(',','.')); }
function parseDateTIC(s){
  if(!s) return '';
  const m = s.match(/(\d{4})(\d{2})(\d{2})/);
  return m ? m[1]+'-'+m[2]+'-'+m[3] : s;
}

async function importCsv(input){
  const file = input.files[0];
  if(!file) return;
  showToast('⏳ Lettura CSV in corso…', 60000);
  try {
    const text = await new Promise(function(res, rej){
      const r = new FileReader();
      r.onload = function(e){ res(e.target.result); };
      r.onerror = function(){ rej(new Error('Lettura file fallita')); };
      r.readAsText(file, 'latin1');
    });
    const movimenti = parseCsvBts(text);
    if(!movimenti.length){ showToast('⚠️ Nessun movimento trovato nel CSV'); return; }
    const existing = _contabile.movimenti || [];
    const existingIds = new Set(existing.map(m => m.id));
    const nuovi = movimenti.filter(m => !existingIds.has(m.id));
    const merged = existing.concat(nuovi);
    _contabile.movimenti = merged;
    await window._fbSaveContabile({ fatture: _contabile.fatture || [], movimenti: merged });
    showToast('✅ ' + nuovi.length + ' movimenti importati');
    switchTab('banca');
  } catch(e) {
    console.error('importCsv error:', e);
    showToast('❌ Errore import CSV: ' + e.message);
  }
  input.value = '';
}

function parseCsvBts(text){
  const lines = text.split(/\r?\n/);
  const movimenti = [];
  let headerFound = false;
  let colData = -1, colImporto = -1, colCausale = -1, colDesc = -1;
  for(let i = 0; i < lines.length; i++){
    const line = lines[i];
    if(!headerFound){
      if(line.indexOf('DATA') !== -1 && line.indexOf('IMPORTO') !== -1){
        const cols = line.split(';').map(function(c){ return c.trim().toUpperCase(); });
        colData = cols.indexOf('DATA');
        colImporto = cols.indexOf('IMPORTO');
        colCausale = cols.findIndex(function(c){ return c.indexOf('CAUSALE') !== -1; });
        colDesc = cols.findIndex(function(c){ return c.indexOf('DESCR') !== -1; });
        headerFound = true;
      }
      continue;
    }
    if(!line.trim()) continue;
    const parts = line.split(';');
    if(parts.length < 3) continue;
    const rawData = colData >= 0 ? (parts[colData]||'').trim() : '';
    const rawImporto = colImporto >= 0 ? (parts[colImporto]||'').trim() : '';
    const causale = colCausale >= 0 ? (parts[colCausale]||'').trim() : '';
    const descrizione = colDesc >= 0 ? (parts[colDesc]||'').trim() : '';
    if(!rawData || !rawImporto) continue;
    const data = parseDateBts(rawData);
    const importo = parseFloat(rawImporto.replace(/\./g,'').replace(',','.'));
    if(isNaN(importo)) continue;
    movimenti.push({ id: 'bts_'+data+'_'+importo.toFixed(2)+'_'+i, data: data, importo: importo, causale: causale, descrizione: descrizione, fonte: 'bts' });
  }
  return movimenti;
}

function parseDateBts(s){
  const m = s.match(/(\d{2})[\.\-\/](\d{2})[\.\-\/](\d{4})/);
  return m ? m[3]+'-'+m[2]+'-'+m[1] : s;
}

function apriAssegna(fatturaId){
  _assegnaFatturaId = fatturaId;
  const f = (_contabile.fatture||[]).find(function(x){ return x.id === fatturaId; });
  if(!f) return;
  const nomeContatto = f.fornitore || f.cliente || '—';
  document.getElementById('assegnaInfo').innerHTML = '<strong>' + nomeContatto + '</strong><br>Fattura ' + (f.numeroFattura||'—') + ' · ' + (f.dataFattura||'') + '<br><span style="font-size:15px;font-weight:700;color:' + (f.tipo==='passiva'?'var(--red)':'var(--g2)') + '">' + fmtDec(f.totale) + '</span>';
  document.getElementById('assegnaTipo').value = f.assegnazione || '';
  document.getElementById('assegnaCategoria').value = f.categoria || '';
  const selC = document.getElementById('assegnaCantiere');
  selC.innerHTML = '<option value="">— seleziona cantiere —</option>' + _cantieri.filter(function(c){ return c.nome; }).map(function(c){ return '<option value="' + c.id + '"' + (f.cantiereId===c.id?' selected':'') + '>' + c.nome + '</option>'; }).join('');
  toggleAssegnaFields();
  openModal('mAssegna');
}

async function salvaAssegnazione(){
  const tipo = document.getElementById('assegnaTipo').value;
  const cantiereId = document.getElementById('assegnaCantiere').value;
  const categoria = document.getElementById('assegnaCategoria').value;
  if(!tipo){ showToast('Seleziona dove assegnare la fattura'); return; }
  if(tipo === 'cantiere' && !cantiereId){ showToast('Seleziona un cantiere'); return; }
  const fatture = (_contabile.fatture||[]).map(function(f){
    if(f.id !== _assegnaFatturaId) return f;
    return Object.assign({}, f, { assegnazione: tipo, cantiereId: tipo==='cantiere' ? cantiereId : null, categoria: categoria, stato: 'assegnata' });
  });
  _contabile.fatture = fatture;
  await window._fbSaveContabile({ fatture: fatture, movimenti: _contabile.movimenti||[] });
  document.getElementById('mAssegna').classList.remove('show');
  showToast('✅ Fattura assegnata');
  renderTab(_activeTab);
}

window.addEventListener('DOMContentLoaded', function(){
  const saved = localStorage.getItem('tbg_user');
  if(saved && USERS.indexOf(saved) !== -1){
    doLogin(saved);
  }
});
</script>
