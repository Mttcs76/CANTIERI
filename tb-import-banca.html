<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TB Works — Import Estratto Conto BTS</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#f0f5f2;color:#1a2e22;padding:16px}
.card{background:#fff;border-radius:14px;border:1px solid #e2ede6;padding:16px;margin-bottom:14px;max-width:900px;margin-left:auto;margin-right:auto}
h1{font-family:'Barlow Condensed',sans-serif;font-size:22px;color:#1a4a2e;margin-bottom:2px}
h2{font-family:'Barlow Condensed',sans-serif;font-size:15px;color:#1a4a2e;margin-bottom:10px;letter-spacing:.5px;text-transform:uppercase}
.btn{width:100%;background:#1a4a2e;color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;margin-top:6px}
.btn:hover{background:#2d6a4f}.btn:disabled{background:#b8d4c0;cursor:not-allowed}
.btn-sm{width:auto;padding:6px 14px;font-size:12px;border-radius:8px;margin-top:0}
.btn-danger{background:#dc2626}.btn-danger:hover{background:#b91c1c}
.btn-outline{background:#f0f5f2;color:#1a4a2e;border:1.5px solid #b8d4c0}
.status{padding:10px 12px;border-radius:10px;font-size:12px;font-weight:600;margin-top:10px;line-height:1.6}
.ok{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.err{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.warn{background:#fffbeb;color:#d97706;border:1px solid #fde68a}

/* Upload zone */
.drop-zone{border:2.5px dashed #b8d4c0;border-radius:12px;padding:32px;text-align:center;cursor:pointer;background:#f8faf8;transition:all .15s}
.drop-zone:hover,.drop-zone.drag{border-color:#1a4a2e;background:#f0fdf4}
.drop-zone input{display:none}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#f0f5f2;border-radius:10px;padding:10px;text-align:center}
.kpi-n{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:#1a4a2e}
.kpi-l{font-size:9px;color:#6a9478;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.kpi.pos .kpi-n{color:#15803d}
.kpi.neg .kpi-n{color:#dc2626}
.kpi.warn-k .kpi-n{color:#d97706}

/* Filtri */
.filtri{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filtri button{border:1px solid #b8d4c0;background:#f0f5f2;border-radius:99px;padding:4px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Nunito',sans-serif;color:#4d6b58}
.filtri button.active{background:#1a4a2e;color:#fff;border-color:#1a4a2e}

/* Tabella */
.table-wrap{overflow-x:auto;max-height:520px;overflow-y:auto;border-radius:8px;border:1px solid #e2ede6}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#1a4a2e;color:#fff;padding:8px 6px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0;z-index:1}
td{padding:7px 6px;border-bottom:1px solid #f0f5f2;vertical-align:middle}
tr:hover td{background:#f8faf8}
tr.entrata td{border-left:3px solid #22c55e}
tr.uscita td{border-left:3px solid #ef4444}
tr.nc td{background:#fffbeb}

select.mini{font-size:11px;padding:3px 5px;border-radius:6px;border:1px solid #b8d4c0;background:#f0f5f2;font-family:'Nunito',sans-serif;width:100%;min-width:120px}
.imp-pos{color:#15803d;font-weight:700;white-space:nowrap}
.imp-neg{color:#dc2626;font-weight:700;white-space:nowrap}
.desc-cell{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-badge{display:inline-block;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:700}
</style>
</head>
<body>

<div class="card">
  <h1>🏦 TB WORKS — IMPORT ESTRATTO CONTO BTS</h1>
  <p style="font-size:12px;color:#6a9478;margin-bottom:14px">Carica il CSV esportato da BTS Home Banking · Separatore punto e virgola</p>

  <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()"
    ondragover="event.preventDefault();this.classList.add('drag')"
    ondragleave="this.classList.remove('drag')"
    ondrop="handleDrop(event)">
    <input type="file" id="fileInput" accept=".csv,.txt" onchange="handleFile(event)">
    <div style="font-size:32px;margin-bottom:8px">📂</div>
    <div style="font-weight:700;color:#1a4a2e">Trascina il CSV BTS qui</div>
    <div style="font-size:12px;color:#6a9478;margin-top:4px">oppure clicca per scegliere il file</div>
    <div style="font-size:11px;color:#b8d4c0;margin-top:8px">Formato: ListaMovimentiMultipla_BTS.csv</div>
  </div>
  <div id="uploadStatus"></div>
</div>

<!-- Risultati -->
<div id="risultatiCard" class="card" style="display:none">
  <h2>📊 MOVIMENTI CARICATI</h2>
  <div class="kpi-grid" id="kpiGrid"></div>

  <!-- Filtri -->
  <div class="filtri" id="filtriBar">
    <button class="active" onclick="filtra(this,'tutti')">Tutti</button>
    <button onclick="filtra(this,'entrata')">🟢 Entrate</button>
    <button onclick="filtra(this,'uscita')">🔴 Uscite</button>
    <button onclick="filtra(this,'nc')">⚠️ Da classificare</button>
    <button onclick="filtra(this,'fontanasanta')">🏗 Fontanasanta</button>
    <button onclick="filtra(this,'borghetto')">🏗 Borghetto</button>
    <button onclick="filtra(this,'generale')">🏢 Generale</button>
    <button onclick="filtra(this,'personale')">👤 Personale</button>
    <button onclick="filtra(this,'fisco')">🏛 Fisco/Tasse</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Data</th>
        <th>Importo</th>
        <th style="min-width:280px">Descrizione</th>
        <th>Categoria auto</th>
        <th>Centro di costo</th>
        <th>Tipo</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px">
    <button class="btn btn-outline btn-sm" onclick="esportaCSV()" style="width:100%">📥 Esporta CSV classificato</button>
    <button class="btn btn-sm" id="importBtn" onclick="importaFirebase()" style="width:100%">☁️ Salva su Firebase</button>
    <button class="btn btn-danger btn-sm" onclick="azzeraMovimenti()" style="width:100%">🗑 Azzera movimenti</button>
  </div>
  <div id="importStatus" class="status" style="display:none;margin-top:8px"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const fb = initializeApp({
  apiKey:"AIzaSyDvXu1k4kPWBDnmBZxDs6McM9fqntMMphw",
  authDomain:"tb-cantieri.firebaseapp.com",
  projectId:"tb-cantieri",
  storageBucket:"tb-cantieri.firebasestorage.app",
  messagingSenderId:"91212110377",
  appId:"1:91212110377:web:cbb842678fb0d311a79a38"
});
const db = getFirestore(fb);

let movimenti = [];
let _filtro = 'tutti';

// ── REGOLE DI CLASSIFICAZIONE AUTOMATICA ──
// Ogni regola: { match: string/regex, centro, cat, tipo }
const REGOLE = [
  // ENTRATE — incassi clienti
  { match: /FONTANASANTA/i,         centro:'fontanasanta', cat:'Incasso cliente',    tipo:'entrata' },
  { match: /BORGHETTO/i,            centro:'borghetto',    cat:'Incasso cliente',    tipo:'entrata' },
  // Ritenute fiscali su bonifici in entrata Fontanasanta → rimangono su fontanasanta
  { match: /RITENUTA FISCALE.*BONIFICO RICEV.*FONTANASANTA/i, centro:'fontanasanta', cat:'Incasso cliente', tipo:'entrata' },
  { match: /RITENUTA FISCALE.*FONTANASANTA/i, centro:'fontanasanta', cat:'Incasso cliente', tipo:'entrata' },
  // Fornitori cantiere Fontanasanta
  { match: /CALLIARI FRANCO/i,      centro:'fontanasanta', cat:'Subappalto',         tipo:'uscita' },
  { match: /NEW DELHI/i,            centro:'fontanasanta', cat:'Vitto cantiere',     tipo:'uscita' },
  { match: /BRENNERPONT/i,          centro:'fontanasanta', cat:'Subappalto/Nolo',    tipo:'uscita' },
  { match: /DECARLI MATTHIEU|DE CARLI MATTHIEU/i, centro:'fontanasanta', cat:'Subappalto', tipo:'uscita' },
  { match: /CARPENTERIA ROSSI/i,    centro:'fontanasanta', cat:'Subappalto',         tipo:'uscita' },
  { match: /EDILRAVANELLI/i,        centro:'fontanasanta', cat:'Materiali',          tipo:'uscita' },
  { match: /COLORIFICIO FAILONI/i,  centro:'fontanasanta', cat:'Materiali',          tipo:'uscita' },
  { match: /SATIVA/i,               centro:'fontanasanta', cat:'Materiali',          tipo:'uscita' },
  { match: /MGTEC/i,                centro:'fontanasanta', cat:'Materiali',          tipo:'uscita' },
  { match: /TECNOEDIL NOLEGGI/i,    centro:'fontanasanta', cat:'Noleggi',            tipo:'uscita' },
  // Fornitori Borghetto
  { match: /BOSSONG/i,              centro:'borghetto',    cat:'Materiali',          tipo:'uscita' },
  // Vitto cantiere Borghetto (Antica Trattoria + Secchi Francesca)
  { match: /ANTICA TRATTORIA/i,     centro:'borghetto',    cat:'Vitto cantiere',     tipo:'uscita' },
  { match: /SECCHI FRANCESCA/i,     centro:'borghetto',    cat:'Vitto cantiere',     tipo:'uscita' },
  // Personale (compensi soci)
  { match: /MIHALI ILIE/i,          centro:'personale',    cat:'Compenso socio',     tipo:'uscita' },
  { match: /BORGES SOUZA CASSIO/i,  centro:'personale',    cat:'Compenso socio',     tipo:'uscita' },
  // Costi generali
  { match: /KUWAIT PETROLEUM|Q8/i,  centro:'generale',     cat:'Carburante',         tipo:'uscita' },
  { match: /PV 2203/i,              centro:'generale',     cat:'Carburante',         tipo:'uscita' },  // POS carburante anonimo
  { match: /AUTODESK/i,             centro:'generale',     cat:'Software/Licenze',   tipo:'uscita' },
  { match: /ARUBA/i,                centro:'generale',     cat:'Software/Licenze',   tipo:'uscita' },
  { match: /ESNA SOA/i,             centro:'generale',     cat:'Certificazioni/SOA', tipo:'uscita' },
  { match: /PEDROTTI.*BEATRICE|BEATRICE.*PEDROTTI/i, centro:'generale', cat:'INAIL/Sicurezza', tipo:'uscita' },
  { match: /AUSUGUM ASSICURAZIONI/i, centro:'generale',    cat:'Assicurazioni',      tipo:'uscita' },
  { match: /STUDIO GBS|COMMERCIALISTI/i, centro:'generale', cat:'Commercialista',   tipo:'uscita' },
  { match: /iNotai|i Notai|NOTAI.*ROMANO/i, centro:'generale', cat:'Legale/Notaio', tipo:'uscita' },
  { match: /CONFARTIGIANATO/i,      centro:'generale',     cat:'Associazioni',       tipo:'uscita' },
  { match: /CONFIDI TRENTINO/i,     centro:'generale',     cat:'Associazioni',       tipo:'uscita' },
  { match: /LONGO EVENTS/i,         centro:'generale',     cat:'Servizi',            tipo:'uscita' },
  { match: /ANTHROPIC/i,            centro:'generale',     cat:'Software/Licenze',   tipo:'uscita' },
  { match: /Servizi e Gestioni Italia/i, centro:'generale', cat:'Servizi',           tipo:'uscita' },
  { match: /SAPI/i,                 centro:'generale',     cat:'Formazione/Sicurezza', tipo:'uscita' },
  { match: /DALFOVO MAURO/i,        centro:'generale',     cat:'Carburante',         tipo:'uscita' },
  { match: /ORO STUBE/i,            centro:'generale',     cat:'Vitto/Trasferte',    tipo:'uscita' },
  { match: /PIFFER PAOLO/i,         centro:'generale',     cat:'Vitto/Trasferte',    tipo:'uscita' },
  { match: /CCIAA TRENTO/i,         centro:'generale',     cat:'Tassa CCIAA',        tipo:'uscita' },
  { match: /NEXI/i,                 centro:'generale',     cat:'Servizi',            tipo:'uscita' },
  { match: /Ricarica carta prepagate/i, centro:'generale', cat:'Ricarica carta',     tipo:'uscita' },
  { match: /Ricarica carta RICCC/i,  centro:'generale',    cat:'Commissioni banca',  tipo:'uscita' },
  // Fisco
  { match: /Imposte e tasse|Scadenza delega/i, centro:'fisco', cat:'Imposte/Tasse', tipo:'uscita' },
  { match: /Interessi e competenze/i, centro:'fisco',      cat:'Interessi bancari',  tipo:'uscita' },
  { match: /CANONE.*VIRTUAL BANKING|COMMISSIONI.*VIRTUAL/i, centro:'fisco', cat:'Commissioni banca', tipo:'uscita' },
  // Versamenti interni
  { match: /Versamento assegni/i,    centro:'generale',    cat:'Versamento',         tipo:'entrata' },
];

const CENTRI_LABEL = {
  fontanasanta: '🏗 Fontanasanta',
  borghetto:    '🏗 Borghetto',
  generale:     '🏢 Generale',
  personale:    '👤 Personale',
  fisco:        '🏛 Fisco/Tasse',
  nc:           '⚠️ Da classificare',
  skip:         '⛔ Ignora',
};

const CATS = [
  'Incasso cliente','Subappalto','Subappalto/Nolo','Materiali','Noleggi',
  'Vitto cantiere','Vitto/Trasferte','Carburante','Compenso socio',
  'Software/Licenze','Certificazioni/SOA','INAIL/Sicurezza','Assicurazioni',
  'Legale/Notaio','Commercialista','Consulenza','Associazioni','Servizi',
  'Formazione/Sicurezza','Imposte/Tasse','Ritenuta d\'acconto','Interessi bancari',
  'Commissioni banca','Tassa CCIAA','Ricarica carta','Versamento','Altro'
];

function classifica(desc) {
  for (const r of REGOLE) {
    if (typeof r.match === 'string') {
      if (desc.toLowerCase().includes(r.match.toLowerCase()))
        return { centro: r.centro, cat: r.cat, tipo: r.tipo };
    } else {
      if (r.match.test(desc))
        return { centro: r.centro, cat: r.cat, tipo: r.tipo };
    }
  }
  return { centro: 'nc', cat: 'Altro', tipo: 'nc' };
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/);
  const movs = [];
  let headerFound = false;

  for (const line of lines) {
    if (line.includes('DATA;VALUTA;IMPORTO')) { headerFound = true; continue; }
    if (!headerFound) continue;
    if (!line.trim() || line.startsWith('-') || line.startsWith('Totale')) continue;

    const cols = line.split(';').map(c => c.trim());
    if (cols.length < 6) continue;

    const [data, valuta, importoRaw, divisa, causale, ...descParts] = cols;
    if (!data || !data.match(/\d{2}\/\d{2}\/\d{4}/)) continue;

    const importo = parseFloat(importoRaw.replace(/\./g,'').replace(',','.'));
    if (isNaN(importo)) continue;

    const desc = descParts.join(' ').trim().replace(/;$/, '').trim();
    const cl = classifica(desc + ' ' + causale);

    movs.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,5),
      data: data.replace(/\s/g,''),
      valuta: valuta.replace(/\s/g,''),
      importo,
      divisa: divisa.replace(/\s/g,''),
      causale: causale.replace(/\s/g,''),
      desc,
      centro: cl.centro,
      cat: cl.cat,
      tipo: cl.tipo === 'nc' ? (importo > 0 ? 'entrata' : 'uscita') : cl.tipo,
      classificatoAuto: cl.centro !== 'nc',
    });
  }
  return movs;
}

function fmtEur(n) {
  const abs = Math.abs(n).toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2});
  return (n >= 0 ? '+' : '−') + ' € ' + abs;
}

function renderKPI() {
  const entrate = movimenti.filter(m=>m.tipo==='entrata').reduce((s,m)=>s+m.importo,0);
  const uscite = Math.abs(movimenti.filter(m=>m.tipo==='uscita').reduce((s,m)=>s+m.importo,0));
  const saldo = movimenti.reduce((s,m)=>s+m.importo,0);
  const nc = movimenti.filter(m=>m.centro==='nc').length;
  const classificati = movimenti.filter(m=>m.classificatoAuto).length;
  document.getElementById('kpiGrid').innerHTML = `
    <div class="kpi pos"><div class="kpi-n">${(entrate).toLocaleString('it-IT',{minimumFractionDigits:0})} €</div><div class="kpi-l">Entrate</div></div>
    <div class="kpi neg"><div class="kpi-n">${(uscite).toLocaleString('it-IT',{minimumFractionDigits:0})} €</div><div class="kpi-l">Uscite</div></div>
    <div class="kpi ${saldo>=0?'pos':'neg'}"><div class="kpi-n">${saldo.toLocaleString('it-IT',{minimumFractionDigits:0})} €</div><div class="kpi-l">Saldo periodo</div></div>
    <div class="kpi"><div class="kpi-n">${movimenti.length}</div><div class="kpi-l">Movimenti</div></div>
    <div class="kpi ${nc>0?'warn-k':'pos'}"><div class="kpi-n">${nc}</div><div class="kpi-l">Da classificare</div></div>
  `;
}

function renderTabella() {
  const filtered = movimenti.filter(m => {
    if (_filtro === 'tutti') return true;
    if (_filtro === 'nc') return m.centro === 'nc';
    if (_filtro === 'entrata') return m.tipo === 'entrata';
    if (_filtro === 'uscita') return m.tipo === 'uscita';
    return m.centro === _filtro;
  });

  document.getElementById('tbody').innerHTML = filtered.map((m,i) => {
    const centroOpts = Object.entries(CENTRI_LABEL).map(([v,l]) =>
      `<option value="${v}" ${v===m.centro?'selected':''}>${l}</option>`
    ).join('');
    const catOpts = CATS.map(c => `<option ${c===m.cat?'selected':''}>${c}</option>`).join('');
    const idx = movimenti.indexOf(m);
    const rowClass = m.tipo==='entrata' ? 'entrata' : m.centro==='nc' ? 'nc' : 'uscita';
    return `<tr class="${rowClass}">
      <td style="white-space:nowrap;font-size:11px;color:#6a9478">${m.data}</td>
      <td class="${m.importo>=0?'imp-pos':'imp-neg'}">${fmtEur(m.importo)}</td>
      <td class="desc-cell" title="${m.desc.replace(/"/g,'')}">${m.desc||'—'}</td>
      <td><select class="mini" onchange="setCentro(${idx},this.value)">${centroOpts}</select></td>
      <td><select class="mini" onchange="setCat(${idx},this.value)">${catOpts}</select></td>
      <td style="font-size:10px;color:${m.classificatoAuto?'#22c55e':'#f59e0b'};font-weight:600">${m.classificatoAuto?'✓ Auto':'✎ Manuale'}</td>
    </tr>`;
  }).join('');
}

window.setCentro = (idx, val) => {
  movimenti[idx].centro = val;
  movimenti[idx].classificatoAuto = false;
  renderKPI();
};
window.setCat = (idx, val) => {
  movimenti[idx].cat = val;
  movimenti[idx].classificatoAuto = false;
};
window.filtra = (btn, filtro) => {
  _filtro = filtro;
  document.querySelectorAll('.filtri button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTabella();
};

function processFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      // Prova UTF-8, poi Latin-1
      let text = e.target.result;
      movimenti = parseCSV(text);
      if (!movimenti.length) throw new Error('Nessun movimento trovato. Verifica il formato del file.');
      const st = document.getElementById('uploadStatus');
      st.className = 'status ok';
      st.textContent = `✅ Caricati ${movimenti.length} movimenti da ${file.name}`;
      document.getElementById('risultatiCard').style.display = 'block';
      renderKPI();
      renderTabella();
    } catch(err) {
      const st = document.getElementById('uploadStatus');
      st.className = 'status err';
      st.textContent = '❌ Errore: ' + err.message;
    }
  };
  reader.readAsText(file, 'windows-1252');
}

window.handleFile = e => processFile(e.target.files[0]);
window.handleDrop = e => {
  e.preventDefault();
  document.getElementById('dropZone').classList.remove('drag');
  processFile(e.dataTransfer.files[0]);
};

window.esportaCSV = () => {
  const rows = [['Data','Importo','Descrizione','Centro di costo','Categoria','Tipo']];
  movimenti.forEach(m => rows.push([m.data, m.importo, '"'+m.desc.replace(/"/g,'')+'"', m.centro, m.cat, m.tipo]));
  const csv = rows.map(r=>r.join(';')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
  a.download = 'bts_classificato_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
};

window.importaFirebase = async () => {
  const btn = document.getElementById('importBtn');
  const st = document.getElementById('importStatus');
  btn.disabled = true; btn.textContent = 'Salvataggio...';
  st.style.display = 'block'; st.className = 'status info'; st.textContent = 'Connessione a Firebase...';
  try {
    const snap = await getDoc(doc(db,'tbcantieri','shared'));
    if (!snap.exists()) throw new Error('Database non trovato. Sincronizza prima dall\'app.');
    const S = snap.data();
    S.azienda = S.azienda || {};
    S.azienda.movimentiBanca = S.azienda.movimentiBanca || [];
    S.azienda.costiFissi = S.azienda.costiFissi || [];
    S.cantieri = S.cantieri || [];

    // Trova cantieri
    const cF = S.cantieri.find(c=>(c.nome||'').toLowerCase().includes('fontanasanta'));
    const cB = S.cantieri.find(c=>(c.nome||'').toLowerCase().includes('borghetto'));
    if(cF) cF.speseMateriali = cF.speseMateriali || [];
    if(cB) cB.speseMateriali = cB.speseMateriali || [];

    let nNuovi=0, nDup=0, nF=0, nB=0, nG=0, nSkip=0;

    for (const m of movimenti) {
      if (m.centro === 'skip') { nSkip++; continue; }
      const key = m.data+'|'+m.importo+'|'+m.desc.slice(0,30);

      // Registra in movimentiBanca (tutti, entrate e uscite)
      if (!S.azienda.movimentiBanca.some(x=>x.key===key)) {
        S.azienda.movimentiBanca.push({ ...m, key, importedAt: Date.now() });
        nNuovi++;
      } else {
        nDup++; continue;
      }

      // Solo uscite → distribuisci ai centri di costo
      if (m.importo >= 0) continue;
      const importoAbs = Math.abs(m.importo);
      const desc = m.desc.slice(0,80);

      if (m.centro === 'fontanasanta' && cF) {
        if (!cF.speseMateriali.some(s=>s.key===key)) {
          cF.speseMateriali.push({ id:key, desc, cat:m.cat||'Altro', importo:importoAbs, data:m.data, capId:'', note:'', utente:'Import banca', key, created:Date.now() });
          nF++;
        }
      } else if (m.centro === 'borghetto' && cB) {
        if (!cB.speseMateriali.some(s=>s.key===key)) {
          cB.speseMateriali.push({ id:key, desc, cat:m.cat||'Altro', importo:importoAbs, data:m.data, capId:'', note:'', utente:'Import banca', key, created:Date.now() });
          nB++;
        }
      } else if (['generale','personale','fisco'].includes(m.centro)) {
        if (!S.azienda.costiFissi.some(s=>s.key===key)) {
          S.azienda.costiFissi.push({ id:key, desc, cat:m.cat||'Altro', freq:'una-tantum', importo:importoAbs, scadenza:m.data, centro:m.centro, note:'', key, created:Date.now() });
          nG++;
        }
      }
      // nc → solo movimentiBanca, nessun collegamento
    }

    S.azienda.saldoBanca = parseFloat((S.azienda.movimentiBanca.reduce((s,m)=>s+m.importo,0)).toFixed(2));

    await setDoc(doc(db,'tbcantieri','shared'), S);
    st.className = 'status ok';
    st.innerHTML = `<strong>✅ IMPORTATO SU FIREBASE</strong><br>
      Movimenti registrati: ${nNuovi} · Duplicati saltati: ${nDup}<br>
      🏗 Fontanasanta: +${nF} spese<br>
      🏗 Borghetto: +${nB} spese<br>
      🏢 Costi generali/personale/fisco: +${nG} voci<br>
      ⛔ Saltati: ${nSkip}<br>
      <em>Apri TB Works → ricarica la pagina.</em>`;
    btn.textContent = '✅ Salvato!'; btn.style.background = '#22c55e';
  } catch(e) {
    st.className = 'status err'; st.textContent = '❌ Errore: ' + e.message;
    btn.disabled = false; btn.textContent = '☁️ Salva su Firebase';
  }
};

window.azzeraMovimenti = async () => {
  if (!confirm('Azzerare tutti i movimenti bancari salvati su Firebase?')) return;
  try {
    const snap = await getDoc(doc(db,'tbcantieri','shared'));
    const S = snap.data();
    S.azienda = S.azienda || {};
    S.azienda.movimentiBanca = [];
    await setDoc(doc(db,'tbcantieri','shared'), S);
    alert('✅ Movimenti azzerati.');
  } catch(e) { alert('Errore: ' + e.message); }
};
</script>
